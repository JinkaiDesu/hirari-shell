# Every push to an agent branch or main is verified by the Emergence release train (the ci-cd
# repository's verify workflow, on the Windows build runner). This job only forwards the event.
name: verify
on:
  push:
    branches: [main, 'agent/**']
jobs:
  forward:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    steps:
      - name: Ask the release train to verify this push
        env:
          TOKEN: ${{ secrets.EMERGENCE_CI_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/JinkaiDesu/ci-cd/dispatches \
            -d '{"event_type":"verify","client_payload":{"repository":"${{ github.repository }}","ref":"${{ github.ref_name }}","sha":"${{ github.sha }}"}}'
